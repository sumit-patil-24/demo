name: LocalBizHub CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Backend & Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Run Tests
        run: |
          cd backend
          pip install -r requirements.txt
          PYTHONPATH=. pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies & Run Tests
        run: |
          cd frontend
          npm install
          CI=true npm test -- --passWithNoTests

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-frontend:latest

      - name: Build and Push Proxy
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-proxy:latest

  deploy:
    name: Deploy & Provision EC2 Host
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Provision via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Install Docker automatically if not present
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing via official script..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER
              sudo systemctl enable docker
              sudo systemctl start docker
            else
              echo "Docker is already installed."
            fi

            # 2. Ensure Docker service is active
            sudo systemctl start docker

            # 3. Clone or update project repository code
            if [ -d "$HOME/localbizhub" ]; then
              cd ~/localbizhub
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git ~/localbizhub
              cd ~/localbizhub
            fi

            # 4. Pull latest built images and launch application stack with sudo
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

       
