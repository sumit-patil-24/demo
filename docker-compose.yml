version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: localbizhub-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: localbizhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d localbizhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localbizhub-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/localbizhub
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localbizhub-frontend
    restart: always

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: localbizhub-proxy
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
